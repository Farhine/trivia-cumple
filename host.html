<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A La Deriva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff8ec;--paper:#fff4dc;--paperInk:#3a2412;--ok:#3ddc97;--bad:#ff5c5c;--gold:#ffd35c;--A:#ff5d8f;--B:#3fa9ff;--C:#ffb627;--D:#7ae582}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1630;color:var(--ink);font-family:Nunito,system-ui,sans-serif}
.title{font-family:'Lilita One',Nunito,sans-serif;letter-spacing:.02em}
#scene{position:fixed;inset:0;overflow:hidden}
#sky{position:absolute;inset:0;transition:background 2.5s ease}
#sun{position:absolute;width:140px;height:140px;border-radius:50%;transition:all 2.5s ease}
.cloud{position:absolute;opacity:.85;animation:drift linear infinite;filter:drop-shadow(0 6px 8px rgba(0,0,0,.15))}
@keyframes drift{from{transform:translateX(-200px)}to{transform:translateX(calc(100vw + 200px))}}
#three{position:absolute;inset:0}
#rain{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 2s;background-image:repeating-linear-gradient(105deg,rgba(255,255,255,.2) 0 2px,transparent 2px 22px);animation:rain .5s linear infinite}
@keyframes rain{from{background-position:0 0}to{background-position:-40px 120px}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.storm #rain{opacity:1}.storm #flash{animation:flash 7s infinite}
@keyframes flash{0%,93%,100%{opacity:0}94%{opacity:.7}95%{opacity:0}96%{opacity:.5}}
#fallback{position:absolute;left:0;right:0;bottom:90px;display:none;justify-content:center;flex-wrap:wrap;gap:8px;font-size:40px}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:14px 26px;display:flex;gap:18px;align-items:center;z-index:10}
#brand{font-size:26px;text-shadow:0 3px 0 rgba(0,0,0,.35);white-space:nowrap}
#route{flex:1;position:relative;height:54px}
#route .line{position:absolute;left:2%;right:2%;top:27px;border-top:3px dashed rgba(255,255,255,.6)}
#route .isl{position:absolute;top:8px;transform:translateX(-50%);font-size:24px;text-align:center;transition:transform .5s}
#route .isl small{display:block;font-size:10px;font-weight:800}
#route .isl.done{opacity:.5}#route .isl.now{transform:translateX(-50%) scale(1.4)}
#route .boat{position:absolute;top:-6px;font-size:30px;transform:translateX(-50%);transition:left 2.5s cubic-bezier(.5,0,.3,1);animation:bob 1.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-4px)}}
.chip{background:rgba(0,0,0,.42);backdrop-filter:blur(4px);padding:8px 14px;border-radius:99px;font-weight:800;white-space:nowrap;font-size:17px}
#stats{display:flex;gap:8px}
#goalbar{position:fixed;left:26px;right:26px;top:80px;height:12px;border-radius:6px;background:rgba(0,0,0,.35);z-index:10;overflow:hidden}
#goalbar div{height:100%;border-radius:6px;transition:width 1s,background 1s}
#goalbar span{position:absolute;top:0;bottom:0;width:3px;background:#fff}
/* panel */
#panel{position:fixed;left:50%;top:104px;transform:translateX(-50%);width:min(1120px,92vw);z-index:9;max-height:calc(100vh - 230px)}
.card{background:var(--paper);color:var(--paperInk);border-radius:22px;padding:24px 30px;box-shadow:0 14px 0 rgba(0,0,0,.25),0 30px 60px rgba(0,0,0,.35);border:4px solid #e9cf9d}
.pop{animation:pop .55s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{0%{transform:scale(.6) rotate(-3deg);opacity:0}100%{transform:none;opacity:1}}
.slide{animation:slide .6s cubic-bezier(.2,1.2,.4,1)}@keyframes slide{0%{transform:translateY(-60px);opacity:0}100%{transform:none;opacity:1}}
.qtop{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.tag{display:inline-block;font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;background:var(--paperInk);color:var(--paper);padding:5px 12px;border-radius:8px}
.stars{color:#e0a100;font-size:20px;margin-left:8px}
.qtext{font-size:38px;line-height:1.15;margin:12px 0 16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{border-radius:16px;padding:16px 20px;font-size:27px;font-weight:800;color:#24140a;display:flex;gap:14px;align-items:center;box-shadow:0 6px 0 rgba(0,0,0,.18);animation:pop .5s cubic-bezier(.2,1.4,.4,1) backwards}
.opt b{font-family:'Lilita One';background:rgba(255,255,255,.55);border-radius:10px;width:44px;height:44px;display:grid;place-items:center;flex:none}
.o0{background:var(--A)}.o1{background:var(--B)}.o2{background:var(--C)}.o3{background:var(--D)}
.opt:nth-child(2){animation-delay:.08s}.opt:nth-child(3){animation-delay:.16s}.opt:nth-child(4){animation-delay:.24s}
.opt.dim{opacity:.25;filter:grayscale(.7);transition:all .6s}
.opt.win{transform:scale(1.04);outline:5px solid #fff;box-shadow:0 0 0 10px rgba(61,220,151,.6);animation:winp 1s ease-in-out 2}
@keyframes winp{50%{transform:scale(1.08)}}
.timer{width:96px;height:96px;flex:none;position:relative}
.timer svg{transform:rotate(-90deg)}.timer circle{fill:none;stroke-width:10}
.timer .tbg{stroke:#e9cf9d}.timer .tfg{stroke:#ff5d8f;stroke-linecap:round;stroke-dasharray:264;animation:tdown linear forwards}
.timer.wait .tfg{animation:none;stroke:#c9b28a}
@keyframes tdown{from{stroke-dashoffset:0}to{stroke-dashoffset:264}}
.timer div{position:absolute;inset:0;display:grid;place-items:center;font-family:'Lilita One';font-size:34px}
.timer.hurry{animation:shake .3s infinite}@keyframes shake{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.meta{margin-top:12px;font-weight:800;opacity:.75;font-size:18px}
.rtitle{font-size:36px;margin:0 0 8px}
.line{font-size:22px;margin:6px 0;animation:slide .5s backwards}
.ev{font-size:25px;font-weight:800;color:#b5179e;animation:pop .6s backwards}
.intro{text-align:center;padding:36px}
.intro .num{font-size:22px;font-weight:800;letter-spacing:.2em;opacity:.7}
.intro h1{font-size:74px;margin:6px 0 10px}.intro p{font-size:27px;margin:0}
.lobby{display:grid;grid-template-columns:260px 1fr;gap:24px}
.lobby img{width:100%;border-radius:14px;background:#fff;padding:8px}
.code{font-family:'Lilita One';font-size:52px;letter-spacing:.15em;text-align:center}
.gbox{background:#fbe7c0;border-radius:14px;padding:8px 12px;margin-bottom:8px}
.pl{display:inline-flex;align-items:center;gap:4px;background:#fff;border-radius:99px;padding:2px 10px 2px 4px;margin:3px;font-weight:800;font-size:15px;animation:pop .4s}
.pl span{font-size:22px}
textarea,select{font:inherit;border:2px solid #e9cf9d;border-radius:10px;padding:8px;background:#fffaf0;color:var(--paperInk)}
textarea{width:100%}
.btn{font:inherit;font-weight:800;border:0;border-radius:12px;padding:9px 16px;background:var(--paperInk);color:var(--paper);cursor:pointer}
.end h1{font-size:80px;text-align:center;margin:0}
.mvp,.board{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.mvp div,.board div{text-align:center;font-weight:800;font-size:18px;min-width:90px}.mvp span,.board span{font-size:52px;display:block;animation:hop 1.2s infinite}
@keyframes hop{50%{transform:translateY(-6px)}}
.board .dead{opacity:.8}.board .sc{font-family:'Lilita One';font-size:26px;color:#b5179e}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px;max-height:52vh;overflow:auto}
.gallery figure{margin:0;background:#fff;border-radius:12px;padding:6px;text-align:center;font-weight:800;animation:pop .5s backwards}
.gallery img{width:100%;border-radius:8px;display:block;aspect-ratio:1;object-fit:cover}
.bigart{display:block;margin:10px auto;width:260px;border-radius:14px;border:6px solid #fff;box-shadow:0 8px 0 rgba(0,0,0,.2);animation:pop .7s}
.minihead{display:flex;align-items:center;gap:14px}.minihead .ico{font-size:64px;animation:hop 1s infinite}
.games{display:flex;gap:10px;justify-content:center;font-size:44px;margin-top:10px}
.games span{animation:pop .5s backwards}
/* narrador */
#narr{position:fixed;left:22px;bottom:22px;display:flex;align-items:flex-end;gap:10px;z-index:12;max-width:min(680px,58vw);pointer-events:none}
#parrot{font-size:82px;filter:drop-shadow(0 4px 3px rgba(0,0,0,.4));transform-origin:50% 90%}
#parrot.talk{animation:talk .22s ease-in-out infinite alternate}
@keyframes talk{from{transform:rotate(-7deg)}to{transform:rotate(7deg) scale(1.06)}}
#bubble{background:#fff;color:#2a1a0a;border-radius:18px 18px 18px 4px;padding:12px 16px;font-size:20px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.2);opacity:0;transform:translateY(10px);transition:all .3s;margin-bottom:46px}
#bubble.show{opacity:1;transform:none}
#ctrl{position:fixed;right:22px;bottom:22px;display:flex;gap:8px;z-index:12;align-items:center}
#ctrl button,#ctrl select{font:inherit;font-weight:800;border:0;border-radius:14px;padding:11px 15px;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;backdrop-filter:blur(4px);font-size:15px}
#ctrl select{max-width:190px}
#ctrl #next{background:#ff5d8f;font-size:18px;box-shadow:0 5px 0 #b8325f}
#ctrl #next.waiting{background:#8a7a9a;box-shadow:0 5px 0 #5a4a6a}
#ctrl .on{background:#1f9e6a}
.confetti{position:fixed;top:-40px;font-size:30px;z-index:20;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
#hint{position:fixed;right:22px;bottom:80px;z-index:12;background:rgba(0,0,0,.6);padding:8px 12px;border-radius:10px;font-size:13px;font-weight:800;max-width:330px;display:none}
</style></head><body>

<div id="tts" style="display:none;position:fixed;right:22px;bottom:84px;z-index:13;background:#fff4dc;color:#3a2412;border-radius:16px;padding:16px;width:360px;box-shadow:0 10px 30px rgba(0,0,0,.4);font-weight:800"><div class="title" style="font-size:22px">🎙️ Voz del narrador</div><label>Proveedor<select id="ttsProv" style="width:100%"><option value="piper">Piper neuronal (gratis, en el navegador)</option><option value="browser">Voz del sistema (gratis)</option><option value="openai">OpenAI (gpt-4o-mini-tts)</option><option value="eleven">ElevenLabs</option></select></label><div id="ttsPiper"><label>Voz Piper<select id="piperVoice" style="width:100%"><option value="es_MX-claude-high">México · Claude (alta calidad)</option><option value="es_MX-ald-medium">México · Ald</option><option value="es_ES-davefx-medium">España · Davefx</option><option value="es_ES-sharvard-medium">España · Sharvard</option></select></label><label style="display:flex;gap:8px;align-items:center;margin:6px 0"><input type="checkbox" id="parrotPitch"> Tono de loro (más agudo y rápido)</label><p id="piperStatus" style="font-size:12px;font-weight:600;margin:6px 0">La primera vez descarga la voz (~60 MB) y queda guardada en este navegador.</p></div><div id="ttsCloud"><label>Clave API<input id="ttsKey" type="password" style="width:100%;font:inherit;padding:6px;border-radius:8px;border:2px solid #e9cf9d" placeholder="sk-… / xi-…"></label><label>Voz<input id="ttsVoice" style="width:100%;font:inherit;padding:6px;border-radius:8px;border:2px solid #e9cf9d" placeholder="OpenAI: ash, ballad, coral… / ElevenLabs: voice_id"></label><p style="font-size:12px;font-weight:600;margin:6px 0">La clave se guarda solo en este navegador. Cada frase cuesta una fracción de centavo; las frases repetidas se reutilizan.</p></div><button class="btn" id="ttsTest">Probar voz</button> <button class="btn" id="ttsClose">Cerrar</button></div>
<div id="ctrl"><button id="ttsBtn" title="Voz del narrador">🎙️</button><select id="voiceSel" title="Voz del narrador"></select><button id="voice">🔊</button><button id="auto" title="Avanzar solo cuando el loro termina">⏩ Auto</button><button id="reset">↺</button><button id="next">Siguiente ▶</button></div>

<script src="lib/peerjs.min.js"></script>

<script type="module">import * as piper from './lib/piper/piper-tts-web.js';window.Piper=piper;window.dispatchEvent(new Event('piper-ready'));</script>
<script>
const $=id=>document.getElementById(id);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let st=null,deadline=0,QRURL='',NET='Conectando…',panelKey='',has3D=false;

// ---------- sala / red ----------
let CODE=null;try{CODE=sessionStorage.getItem('sala')}catch(e){}
if(!CODE){CODE=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(Math.random()*24)]).join('');try{sessionStorage.setItem('sala',CODE)}catch(e){}}
const qs=new URLSearchParams(location.search);
const JOIN=new URL('index.html?sala='+CODE+(qs.get('peerhost')?'&peerhost='+qs.get('peerhost'):''),location.href).href;
{const q=qrcode(0,'M');q.addData(JOIN);q.make();QRURL=q.createDataURL(8,2)}
const peer=new Peer('tcumple-'+CODE,PEER_OPTS);
peer.on('open',()=>{NET='';panelKey='';Game.push()});
peer.on('error',e=>{NET='Error de conexión: '+e.type+(e.type==='unavailable-id'?' (cierra otras pestañas del host)':'');panelKey='';if(st)render()});
peer.on('disconnected',()=>{NET='Reconectando…';setTimeout(()=>peer.reconnect(),1000)});
peer.on('connection',conn=>{conn.on('data',m=>Game.message(conn,m));conn.on('close',()=>Game.closed(conn));conn.on('error',()=>Game.closed(conn))});
fetch('questions.json').then(r=>r.json()).then(bank=>Game.init(bank,{host:x=>{const prev=st;st=x;if(x.q)deadline=Date.now()+x.q.left;if(x.mini)deadline=Date.now()+x.mini.left;render(prev)},send:(c,d)=>{try{if(c.open)c.send(d)}catch(e){}}}));
window.addEventListener('beforeunload',e=>{if(st&&st.stage!=='lobby'&&st.stage!=='end'){e.preventDefault();e.returnValue=''}});

// ---------- 3D ----------
function start3D(){try{Scene3D.init($('three'));has3D=true;if(st)render()}catch(e){console.warn('Sin 3D',e);$('fallback').style.display='flex'}}
if(window.Scene3D)start3D();else window.addEventListener('scene3d-ready',start3D,{once:true});
setTimeout(()=>{if(!has3D)$('fallback').style.display='flex'},5000);

// ---------- ambiente ----------
const ISLES=['⚓','🛡️','⚖️','⛈️','⚔️','🛟','🐾','🌋','🗼','🏝️'];
const SKY=[
 {sky:'linear-gradient(#7ec8ff,#bfe6ff 55%,#e6f6ff)',sun:'#fff3a0',sx:'78%',sy:'12%',fog:0xd8f0ff},
 {sky:'linear-gradient(#5fb4ff,#a8dcff 55%,#e0f2ff)',sun:'#fff0a0',sx:'70%',sy:'9%',fog:0xd0ecff},
 {sky:'linear-gradient(#4aa3f0,#9fd2f7 55%,#ffe9cc)',sun:'#ffe48a',sx:'60%',sy:'8%',fog:0xf5e6d0},
 {sky:'linear-gradient(#2b3a55,#56657f 55%,#7d8aa0)',sun:'#9aa5b5',sx:'55%',sy:'12%',storm:1,fog:0x6d7a90,water:0x24466e,light:0x9aa8c0},
 {sky:'linear-gradient(#ff9a6b,#ffc28a 50%,#ffe0b0)',sun:'#ffd27a',sx:'40%',sy:'20%',fog:0xffd8a8,sunColor:0xffd0a0},
 {sky:'linear-gradient(#ff6e7f,#ffb37a 50%,#ffd9a0)',sun:'#ffb36b',sx:'30%',sy:'28%',fog:0xffc898,sunColor:0xffb080,water:0x2a5a9a},
 {sky:'linear-gradient(#5b3a8c,#c06c84 50%,#f8b195)',sun:'#ff9e6b',sx:'22%',sy:'36%',fog:0xe8a090,sunColor:0xff9070,water:0x2b4a86},
 {sky:'linear-gradient(#1c1f4a,#3d2a6b 50%,#8a4f7d)',sun:'#ff6b4a',sx:'15%',sy:'40%',storm:1,fog:0x5a3f6b,water:0x1d3260,light:0x9080b0},
 {sky:'linear-gradient(#0b1030,#1d2457 55%,#3a3f7a)',sun:'#f4f1d0',sx:'80%',sy:'10%',night:1,fog:0x2a2f60,water:0x142650,light:0x8090d0,sunColor:0xb0c0ff},
 {sky:'linear-gradient(#ff9a8b,#ffd1a6 45%,#bdeeff)',sun:'#fff1a8',sx:'82%',sy:'22%',fog:0xd8f0ff},
];
const LOBBYSKY=SKY[0];
function setSky(i){const s=i>=0?SKY[Math.min(i,9)]:LOBBYSKY;$('sky').style.background=s.sky;const sun=$('sun');sun.style.background=`radial-gradient(circle,${s.sun},${s.sun}00 70%)`;sun.style.left=s.sx;sun.style.top=s.sy;document.body.classList.toggle('storm',!!s.storm);if(has3D)Scene3D.setPhase(i,s)}
for(let i=0;i<5;i++){const c=document.createElement('div');c.className='cloud';c.textContent='☁️';c.style.top=(4+Math.random()*22)+'vh';c.style.fontSize=(50+Math.random()*60)+'px';c.style.animationDuration=(40+Math.random()*50)+'s';c.style.animationDelay=(-Math.random()*80)+'s';$('clouds').appendChild(c)}
function drawRoute(phase){
  const r=$('route');if(!r.dataset.ok){r.innerHTML='<div class="line"></div>'+ISLES.map((e,i)=>`<div class="isl" id="isl${i}" style="left:${4+i*10.2}%">${e}<small>${i+1}</small></div>`).join('')+'<div class="boat" id="boat">⛵</div>';r.dataset.ok=1}
  ISLES.forEach((_,i)=>{$('isl'+i).className='isl'+(i<phase?' done':'')+(i===phase?' now':'')});
  $('boat').style.left=(phase<0?1:4+Math.min(phase,9)*10.2)+'%';
}
function confetti(){for(let i=0;i<90;i++){const d=document.createElement('div');d.className='confetti';d.textContent=['🎉','🎈','🎊','⭐','🍰','🦜'][i%6];d.style.left=Math.random()*100+'vw';d.style.animationDuration=(2.5+Math.random()*3)+'s';d.style.animationDelay=Math.random()*2+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),7000)}}

// ---------- narrador: voz, cola y ritmo ----------
let VOICE_ON=ls.get('voz')!=='0',AUTO=ls.get('auto')!=='0',VOICE=null,talking=false,pendingNext=false,autoT=null,queue=[],bubbleT=null;
const synth='speechSynthesis' in window?speechSynthesis:null;
function voiceScore(v){let s=0;if(/natural|neural/i.test(v.name))s+=100;if(/online/i.test(v.name))s+=40;if(/google/i.test(v.name))s+=30;if(/es-(CL|MX|US|419|AR|CO)/i.test(v.lang))s+=10;return s}
function loadVoices(){if(!synth)return;const vs=synth.getVoices().filter(v=>/^es/i.test(v.lang)).sort((a,b)=>voiceScore(b)-voiceScore(a));const sel=$('voiceSel');const saved=ls.get('vozNombre');
  sel.innerHTML=vs.map(v=>`<option value="${esc(v.name)}">${esc(v.name.replace(/Microsoft |Online |\(Natural\)| - Spanish/g,'').slice(0,34))} (${v.lang})</option>`).join('')||'<option>Sin voces en español</option>';
  VOICE=vs.find(v=>v.name===saved)||vs[0]||null;if(VOICE)sel.value=VOICE.name;
  const natural=vs.some(v=>/natural|neural/i.test(v.name));const h=$('hint');h.style.display=natural?'none':'block';h.textContent='💡 Para una voz mucho más natural, abre esta pantalla en Microsoft Edge: trae voces "Natural" en español (Chile, México y España).';}
if(synth){loadVoices();synth.onvoiceschanged=loadVoices}
setTimeout(ttsUI,0);
$('voiceSel').onchange=e=>{VOICE=synth.getVoices().find(v=>v.name===e.target.value)||VOICE;ls.set('vozNombre',e.target.value);say(line('idle'))};
function updBtns(){$('voice').textContent=VOICE_ON?'🔊':'🔇';$('auto').classList.toggle('on',AUTO)}updBtns();
$('voice').onclick=()=>{VOICE_ON=!VOICE_ON;ls.set('voz',VOICE_ON?'1':'0');updBtns();if(!VOICE_ON&&synth)synth.cancel()};
$('auto').onclick=()=>{AUTO=!AUTO;ls.set('auto',AUTO?'1':'0');updBtns()};
let PRE={};fetch('audio/manifest.json').then(r=>r.ok?r.json():{}).then(m=>{PRE=m||{};const n=Object.keys(PRE).length;if(n){const h=$('hint');h.style.display='block';h.textContent='🎧 '+n+' audios pregrabados del loro listos';setTimeout(()=>h.style.display='none',4000)}}).catch(()=>{});
const hasAudio=t=>!!PRE[audioKey(t)];
const TTS={prov:ls.get('ttsProv')||'piper',key:ls.get('ttsKey')||'',voice:ls.get('ttsVoice')||'',pvoice:ls.get('piperVoice')||'es_MX-claude-high',parrot:ls.get('parrot')!=='0'},AUDIO=new Map();
let PIPER=null,piperVoiceLoaded=null;
function piperStatus(t){const s=$('piperStatus');if(s)s.textContent=t;if(TTS.prov==='piper'){const h=$('hint');h.style.display='block';h.textContent='🎙️ '+t;if(/lista/.test(t))setTimeout(()=>h.style.display='none',3000)}}
async function piperSession(){
  if(!window.Piper)await new Promise((res,rej)=>{window.addEventListener('piper-ready',res,{once:true});setTimeout(()=>rej(new Error('Piper no cargó')),15000)});
  if(PIPER&&piperVoiceLoaded===TTS.pvoice)return PIPER;
  if(!PIPER||piperVoiceLoaded!==TTS.pvoice){Piper.TtsSession._instance=null;piperVoiceLoaded=TTS.pvoice;
    PIPER=Piper.TtsSession.create({voiceId:TTS.pvoice,progress:p=>{if(p&&p.total)piperStatus(`Descargando voz… ${Math.round(p.loaded/p.total*100)}%`)},logger:()=>{}});
    PIPER.then(()=>piperStatus('Voz Piper lista ✔')).catch(e=>{PIPER=null;piperStatus('No se pudo cargar Piper: '+e.message)});}
  return PIPER;
}
function ttsUI(){$('ttsProv').value=TTS.prov;$('ttsKey').value=TTS.key;$('ttsVoice').value=TTS.voice;$('piperVoice').value=TTS.pvoice;$('parrotPitch').checked=TTS.parrot;$('ttsCloud').style.display=/openai|eleven/.test(TTS.prov)?'block':'none';$('ttsPiper').style.display=TTS.prov==='piper'?'block':'none';$('voiceSel').style.display=TTS.prov==='browser'?'':'none'}
$('ttsBtn').onclick=()=>{const p=$('tts');p.style.display=p.style.display==='none'?'block':'none';ttsUI()};$('ttsClose').onclick=()=>$('tts').style.display='none';
['ttsProv','ttsKey','ttsVoice','piperVoice','parrotPitch'].forEach(id=>$(id).onchange=()=>{TTS.prov=$('ttsProv').value;TTS.key=$('ttsKey').value.trim();TTS.voice=$('ttsVoice').value.trim();TTS.pvoice=$('piperVoice').value;TTS.parrot=$('parrotPitch').checked;ls.set('ttsProv',TTS.prov);ls.set('ttsKey',TTS.key);ls.set('ttsVoice',TTS.voice);ls.set('piperVoice',TTS.pvoice);ls.set('parrot',TTS.parrot?'1':'0');ttsUI();if(TTS.prov==='piper')piperSession()});
if(TTS.prov==='piper')setTimeout(piperSession,500);
$('ttsTest').onclick=()=>say(line('lobby'));
function cloudAudio(text,rate){
  const k=TTS.prov+'|'+(TTS.prov==='piper'?TTS.pvoice:TTS.voice)+'|'+rate+'|'+text;if(AUDIO.has(k))return AUDIO.get(k);
  const pr=(TTS.prov==='piper'?piperAudio(text):netAudio(text,rate));AUDIO.set(k,pr);pr.catch(()=>AUDIO.delete(k));return pr;
}
async function piperAudio(text){const s=await piperSession();const wav=await s.predict(text.replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF]/gu,''));return URL.createObjectURL(wav)}
async function netAudio(text,rate){
  let r;
  if(TTS.prov==='openai')r=await fetch('https://api.openai.com/v1/audio/speech',{method:'POST',headers:{Authorization:'Bearer '+TTS.key,'Content-Type':'application/json'},body:JSON.stringify({model:'gpt-4o-mini-tts',voice:TTS.voice||'ash',input:text,response_format:'mp3',speed:rate,instructions:'Eres el Capitán Loro, un loro pirata sarcástico y burlón que narra un juego de trivia en un cumpleaños. Habla en español latinoamericano con acento chileno suave, tono teatral, irónico y con energía, ritmo ágil. Exagera un poco las emociones.'})});
  else r=await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${encodeURIComponent(TTS.voice||'pNInz6obpgDQGcFmaJgB')}?output_format=mp3_44100_128`,{method:'POST',headers:{'xi-api-key':TTS.key,'Content-Type':'application/json'},body:JSON.stringify({text,model_id:'eleven_multilingual_v2',voice_settings:{stability:.35,similarity_boost:.75,style:.6,speed:Math.min(1.2,Math.max(.7,rate))}})});
  if(!r.ok)throw new Error('TTS '+r.status+' '+(await r.text()).slice(0,120));
  return URL.createObjectURL(await r.blob());
}
// say(texto, {then, rate, keep}) — encola; al terminar todo, dispara el "siguiente" pendiente o el auto-avance
function say(text,o={}){if(!text){o.then&&o.then();return}queue.push({text,...o});if(VOICE_ON&&cloudOn()&&!hasAudio(text))cloudAudio(text,o.rate||1.05).catch(()=>{});if(!talking)nextLine()}
function nextLine(){
  const it=queue.shift();if(!it){talking=false;$('parrot').classList.remove('talk');clearTimeout(bubbleT);bubbleT=setTimeout(()=>$('bubble').classList.remove('show'),3000);afterTalk();return}
  talking=true;updNext();const b=$('bubble');b.textContent=it.show||it.text;b.classList.add('show');$('parrot').classList.add('talk');
  let finished=false;const done=()=>{if(finished)return;finished=true;it.then&&it.then();setTimeout(nextLine,250)};
  if(VOICE_ON&&hasAudio(it.text)){const a=new Audio('audio/'+audioKey(it.text)+'.mp3');a.onended=done;a.onerror=()=>{delete PRE[audioKey(it.text)];browserOrCloud(it,done)};a.play().catch(()=>browserOrCloud(it,done));setTimeout(done,Math.max(9000,it.text.length*150));return}
  browserOrCloud(it,done);
}
function browserOrCloud(it,done){
  if(VOICE_ON&&cloudOn()){cloudAudio(it.text,it.rate||1.05).then(url=>{const a=new Audio(url);if(TTS.prov==='piper'){a.preservesPitch=false;a.playbackRate=(TTS.parrot?1.12:1)*(it.rate||1.05)}a.onended=done;a.onerror=done;a.play().catch(done)}).catch(e=>{console.warn(e);$('hint').style.display='block';$('hint').textContent='⚠️ La voz '+(TTS.prov==='piper'?'Piper':'en la nube')+' falló ('+e.message+'). Uso la voz del navegador.';browserSpeak(it,done)});setTimeout(done,Math.max(9000,it.text.length*150))}
  else if(VOICE_ON&&synth)browserSpeak(it,done);
  else setTimeout(done,Math.min(7000,900+it.text.length*45));
}
function browserSpeak(it,done){if(!synth)return setTimeout(done,Math.min(7000,900+it.text.length*45));{const u=new SpeechSynthesisUtterance(it.text);u.lang=VOICE?VOICE.lang:'es-ES';if(VOICE)u.voice=VOICE;u.rate=it.rate||1.05;u.pitch=/natural|neural|online/i.test(VOICE&&VOICE.name||'')?1.05:1.2;u.onend=done;u.onerror=done;synth.speak(u);setTimeout(done,Math.max(4000,it.text.length*110))}}
function cloudOn(){return TTS.prov==='piper'||(/openai|eleven/.test(TTS.prov)&&!!TTS.key)}
function hush(){queue=[];if(synth)synth.cancel();talking=false;$('parrot').classList.remove('talk')}
function updNext(){const n=$('next');n.classList.toggle('waiting',talking);n.textContent=talking?(pendingNext?'⏳ El loro termina…':'🦜 Hablando…'):({lobby:'Zarpar ▶',question:'Cerrar ▶',mini:'Terminar ▶',end:'Fin'}[st&&st.stage]||'Siguiente ▶')}
function afterTalk(){updNext();clearTimeout(autoT);if(pendingNext){pendingNext=false;return Game.next()}
  if(AUTO&&st&&(st.stage==='intro'||st.stage==='reveal'))autoT=setTimeout(()=>{if(!talking&&(st.stage==='intro'||st.stage==='reveal'))Game.next()},2200)}
function doNext(){clearTimeout(autoT);if(talking){pendingNext=true;updNext();return}Game.next()}
$('next').onclick=doNext;
$('reset').onclick=()=>{if(confirm('¿Reiniciar la partida? Los jugadores se mantienen.')){hush();Game.reset()}};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!/TEXTAREA|SELECT/.test(e.target.tagName)){e.preventDefault();doNext()}
  if(e.code==='KeyS'&&e.shiftKey){hush();updNext()}});

const MODE={best:'mejor',worst:'peor'};
function narrate(prev){
  const key=st.stage+'|'+st.phase+'|'+(st.q?st.q.id:'')+'|'+(st.mini?st.mini.id+st.mini.phase:'')+'|'+(st.result?st.result.title+st.result.lines.join():'');
  if(narrate.k===key)return;const first=narrate.k===undefined;narrate.k=key;
  if(st.stage==='lobby'){if(prev){const old=new Set(prev.crew.map(c=>c.id));const nu=st.crew.filter(c=>!old.has(c.id));if(nu.length&&queue.length<2)say(line('join',{name:nu[0].name,ani:''}))}return}
  if(first)return;
  if(st.stage==='intro'){if(st.phase===0)say(line('start'));return say(line('intro.'+st.phase))}
  if(st.stage==='question'){const q=st.q;if(q.kind==='trial'){const g=line('trialGen');return hasAudio(g)?say(g,{then:()=>{Game.arm();say(line('go'))}}):say(line('q.trial',{name:q.accusedName,charge:q.charge}),{then:()=>{Game.arm();say(line('go'))}})}const pre=q.kind==='solo'&&q.d>=4?line('q.hard'):q.kind==='solo'&&q.d===1?line('q.easy'):line('q.'+q.kind);
    say(pre);return say(q.text,{show:'❓ '+q.text,then:()=>{Game.arm();say(line('go'),{rate:1.15})}})}
  if(st.stage==='mini'){const m=st.mini;
    if(m.phase==='play'){if(m.type==='draw'){say(line('drawGen'));say(m.prompt);return say(line(m.mode==='best'?'modeBest':'modeWorst'),{then:()=>{Game.arm();say(line('go'))}})}
      const t=line('mini.'+m.type,{prompt:m.prompt||'',mode:MODE[m.mode]||''});
      if(m.type==='dict'){say(t);say(m.text,{rate:.8,show:'🗣️ (escuchen bien…)'});say(line('repeat'));return say(m.text,{rate:.75,show:'🗣️ (una vez más…)',then:()=>{Game.arm();say(line('go'))}})}
      return say(t,{then:()=>{Game.arm();say(line('go'))}})}
    if(m.phase==='vote')return say(line(m.mode==='best'?'voteBest':'voteWorst'));return}
  if(st.stage==='end')return say(st.sunk?line('sunk'):(st.goal.have>=st.goal.need?line('win'):line('lose')));
  if(st.stage==='reveal'&&prev){
    const r=st.result,pm=Object.fromEntries((prev.crew||[]).map(c=>[c.id,c.alive]));
    const fell=st.crew.filter(c=>pm[c.id]===true&&!c.alive),back=st.crew.filter(c=>pm[c.id]===false&&c.alive);
    const parts=[];const pick=a=>a[Math.floor(Math.random()*a.length)];const P_=x=>{if(x)parts.push(x)};
    if(r.kind==='mini'){if(r.art)P_(line('art'));P_(line('miniEnd'));if(fell.length)P_(line('miniFall',{name:fell[0].name}))}
    else if(r.kind==='vote')P_(line('vote'));
    else if(r.kind==='trial')P_(fell.length?line('guilty'):line('innocent'));
    else if(r.kind==='council'&&!fell.length)P_(/acertó/.test(r.lines.join(' '))?line('councilOk'):line('none'));
    else if(r.kind==='shop'&&/Sin mayoría/.test(r.title))P_(line('noMajority'));
    else if(r.kind==='shop')P_(/guarda/.test(r.lines.join(' '))?line('save'):line('shop'));
    else if(r.kind==='shield')P_(st.crew.some(c=>c.immune)?line('shieldOk'):line('shieldNo'));
    else if(!fell.length&&!back.length&&['solo','group','splitQ','council'].includes(r.kind))P_(line('none'));
    if(fell.length&&r.kind!=='trial'&&r.kind!=='mini')P_(line(fell.length>=Math.max(3,prev.alive/2)?'many':'few',{n:fell.length,name:pick(fell).name,ani:''}));
    if(back.length)P_(line('back',{name:pick(back).name}));
    if(st.sunk)P_(line('sunk'));
    if(!parts.length)P_(line('miniEnd'));
    parts.forEach(x=>say(x));
  }
}

const KIND={solo:'Trivia individual',shield:'Escudo colectivo · 60%',shop:'Tienda del barco',group:'Respuesta de manada',split:'Elige tu bando',splitQ:'Desafío de bandos · 50%',vote:'Votación de la tripulación',revive:'Rescate · náufragos incluidos',council:'🗣️ Consejo · debatan en voz alta',trial:'⚖️ Juicio a bordo'};
const MINI={draw:{ico:'🎨',name:'Galería del naufragio'},math:{ico:'🧮',name:'Cálculo bajo el agua'},dict:{ico:'📝',name:'El dictado del loro'},wario:{ico:'⚡',name:'Microjuegos relámpago'}};

    const d=$('dist');if(d&&st.q.dist){const tot=Math.max(1,st.q.dist.reduce((a,b)=>a+b,0));d.innerHTML=st.q.dist.map((n,i)=>`<div style="display:flex;align-items:center;gap:10px;margin:4px 0;font-weight:800"><span style="width:${st.q.kind==='trial'?130:40}px">${st.q.kind==='trial'?esc(st.q.opts[i]):'ABCD'[i]}</span><div style="flex:1;background:#f0dcb4;border-radius:8px;height:22px;overflow:hidden"><div class="o${i%4}" style="height:100%;width:${n/tot*100}%;transition:width .5s"></div></div><span style="width:30px">${n}</span></div>`).join('')}}
  if(st.mini){const m=$('meta');if(m)m.textContent=st.mini.phase==='vote'?`Votaron ${st.mini.sent} de ${st.mini.voters}`:(st.mini.armed?`Enviaron ${st.mini.sent}`:'🦜 Escuchen las instrucciones…')}

function timer(armed,secs){return `<div class="timer ${armed?'':'wait'}" id="tmr"><svg width="96" height="96"><circle class="tbg" cx="48" cy="48" r="42"/><circle class="tfg" cx="48" cy="48" r="42" style="animation-duration:${secs}s"/></svg><div id="tnum">${armed?'':'🦜'}</div></div>`}

     ${q.kind==='trial'?`<div style="font-size:24px;font-weight:800">🎤 ${esc(q.accusedName)}, ¡defiéndete en voz alta! El resto vota en su celular.</div>`:`<div class="opts">${q.opts.map((o,i)=>`<div class="opt o${i%4} ${(q.hide||[]).includes(i)?'dim':''}"><b>${'ABCD'[i]}</b>${esc(o)}</div>`).join('')}</div>`}${q.kind==='council'?'<div style="font-size:22px;font-weight:800;margin-top:10px">🗣️ ¡Debatan entre todos! Cuenta la respuesta de la mayoría del barco; si se equivocan, caen quienes votaron mal.</div>':''}${q.dist?'<div id="dist" style="margin-top:12px"></div>':''}<div class="meta" id="meta"></div></div>`}
  if(st.stage==='mini'){const m=st.mini,M=MINI[m.type];

    const how={draw:`Los náufragos dibujan en su celular: <b>«${esc(m.prompt)}»</b>. Luego los de a bordo votan el <b>${MODE[m.mode]}</b> dibujo, y su autor vuelve al barco.`,

    return `<div class="card pop"><div class="qtop"><div class="minihead"><span class="ico">${M.ico}</span><div><span class="tag">Minijuego</span><div class="title" style="font-size:44px">${M.name}</div></div></div>${timer(m.armed,m.left/1000)}</div>

      <div class="board">${(r.board||[]).map(b=>`<div class="${b.alive?'':'dead'}"><span>${b.alive?b.ani:'🛟'}</span>${esc(b.name)}<div class="sc">${b.score}</div><small>${esc(r.unit)}</small></div>`).join('')}</div>

     <div class="rtitle title">${esc(r.title)}</div>${r.lines.map((l,i)=>`<div class="line" style="animation-delay:${.3+i*.25}s">${esc(l)}</div>`).join('')}${r.events.map((l,i)=>`<div class="ev" style="animation-delay:${.6+(r.lines.length+i)*.3}s">${esc(l)}</div>`).join('')}</div>`}
  if(st.stage==='end'){const win=!st.sunk&&st.goal.have>=st.goal.need;
    return `<div class="card end pop"><h1 class="title">${win?'🎉 ¡Llegamos a puerto!':'🌊 El barco se hundió'}</h1><p style="text-align:center;font-size:26px;font-weight:800">${st.goal.have} de ${st.total} a bordo · meta ${st.goal.need} · pozo ${st.pool}</p><div style="text-align:center;font-weight:800;opacity:.7">Quienes más aportaron a la tripulación</div><div class="mvp">${st.mvps.map(m=>`<div><span>${m.ani||'🐾'}</span>${esc(m.name)}<br>${m.hits} ${m.hits===1?'acierto':'aciertos'}</div>`).join('')}</div></div>`}
  return '';
}
function bindLobby(){const sg=$('sg');if(sg)sg.onclick=()=>Game.setGroups($('gr').value.split('\n').map(x=>x.trim()).filter(Boolean));const sh=$('shf');if(sh)sh.onclick=()=>Game.shuffleGroups()}
function tick(){const t=$('tnum'),armed=st&&(st.q?st.q.armed:st.mini?st.mini.armed:false);if(t&&armed){const s=Math.max(0,Math.ceil((deadline-Date.now())/1000));t.textContent=s;$('tmr').classList.toggle('hurry',s<=5&&s>0)}}
setInterval(tick,200);
setTimeout(()=>say(line('lobby')),1500);
</script></body></html>
